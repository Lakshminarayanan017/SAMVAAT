name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.10'

jobs:
  # ── The gate that matters ───────────────────────────────────────────────────
  # Runs first and everything else depends on it. If the contracts are broken or
  # a ContentBlock excludes a persona, nothing downstream is worth testing.
  contracts:
    name: contracts · schema, drift and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generated code matches the schemas
        run: npm run contracts:check

      # The Workplace Language Bank is built before the contracts gate runs, so
      # the gate validates the real corpus rather than skipping a missing dist.
      - name: Build the Workplace Language Bank
        run: npm run content:build

      - name: Content — schema, accessibility, Easy-Read and coverage
        run: npm run content:validate

      - name: Schema, accessibility and gate self-test
        run: npm run contracts:validate

      - name: Typecheck
        run: npm run typecheck -w @samvaad/contracts

      # Consumed by the api job so both languages test the exact same artefacts.
      - uses: actions/upload-artifact@v4
        with:
          name: generated-contracts
          path: packages/contracts/generated/
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: content-bank
          path: packages/content/dist/
          retention-days: 1

  api:
    name: api · lint and tests
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - uses: actions/download-artifact@v4
        with:
          name: generated-contracts
          path: packages/contracts/generated/

      # The practice loop serves the real phrase bank, so its tests need the
      # same built artefact the content job validated.
      - uses: actions/download-artifact@v4
        with:
          name: content-bank
          path: packages/content/dist/

      - run: pip install -r requirements-dev.txt
        working-directory: apps/api

      - run: ruff check .
        working-directory: apps/api

      - name: Tests (includes cross-language contract round-trip)
        run: pytest -q
        working-directory: apps/api

  speech:
    name: speech · lint, tests and eval harness
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/speech/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
        working-directory: services/speech

      # g2p_en fetches its CMUdict and tagger corpora on first call, not on
      # import. Without this step the phonemiser reports itself unavailable and
      # every GOP test skips — a green build that proved nothing.
      - name: Warm the phonemiser corpora
        working-directory: services/speech
        run: python -m scripts.warm_g2p

      - run: ruff check .
        working-directory: services/speech

      - run: pytest -q
        working-directory: services/speech

      # The eval table every speech PR must include, printed into the job summary
      # so reviewers see it without checking out the branch.
      #
      # `--gates` makes this a gate rather than a report: the PPI monotonicity
      # and disfluency-invariance checks are properties of our own scoring maths,
      # need no licensed corpus, and are the proof behind ADR-0003. A build that
      # breaks them fails here.
      - name: Speech eval and fairness gates
        working-directory: services/speech
        run: |
          python -m eval.harness --set atypical --gates | tee -a "$GITHUB_STEP_SUMMARY"

  genai:
    name: genai · lint and tests
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/genai/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
        working-directory: services/genai

      - run: ruff check .
        working-directory: services/genai

      # Includes TestDisfluencyInvariance, which proves the interview rubric
      # cannot be moved by a learner's stammer. It is the fairness claim the
      # product is built on, and until now it was never run by CI.
      - run: pytest -q
        working-directory: services/genai

  platform:
    name: platform · lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install -e . ruff pytest
        working-directory: packages/platform

      - run: ruff check .
        working-directory: packages/platform

      # Redaction and service auth are privacy- and security-critical and are
      # shared by every service, so a regression here is a regression everywhere.
      - run: pytest -q
        working-directory: packages/platform

  web:
    name: web · lint, typecheck, tests and build
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The web app imports the generated types and the built phrase bank, so
      # both must exist before it can typecheck or build.
      - run: npm run contracts:build
      - run: npm run content:build

      - run: npm run lint -w @samvaad/web

      - run: npm run typecheck -w @samvaad/web

      # Includes the Modality Router proof (one block, five channels, five
      # personas), the contrast conformance suite across all four themes, and
      # the boundary self-test that proves the router cannot be bypassed.
      - run: npm run test -w @samvaad/web

      - run: npm run build -w @samvaad/web

  # ── Ethics Charter enforcement ──────────────────────────────────────────────
  # Rules that are cheap to check statically. The rest are enforced by the tests
  # named beside each rule in docs/ETHICS_CHARTER.md.
  ethics:
    name: ethics · charter rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: E2 — the rubric exclusion list is present and unmodified
        run: |
          grep -q 'EXCLUDED DIMENSIONS' docs/ETHICS_CHARTER.md
          for dimension in speech_rate articulation_quality gaze facial_affect \
                           motor_stillness response_latency accent; do
            grep -q "$dimension" docs/ETHICS_CHARTER.md \
              || { echo "::error::excluded dimension '$dimension' missing from the charter"; exit 1; }
          done

      - name: Every charter rule names an enforcing test
        run: |
          missing=0
          for rule in E1 E2 E3 E4 E5 E6 E7; do
            grep -q "### $rule ·" docs/ETHICS_CHARTER.md \
              || { echo "::error::rule $rule missing from the charter"; missing=1; }
          done
          exit $missing

      # The charter cites the file that enforces each rule. Those citations rot
      # as tests move, and a charter pointing at files that do not exist is
      # documentation pretending to be a control - you cannot check enforcement
      # by following it. Six of seven had already gone stale once.
      #
      # A rule with no enforcement yet must say NOT YET ENFORCED rather than
      # cite a file that was never written.
      - name: Every path the charter cites actually exists
        run: |
          missing=0
          for path in $(grep -oE '`[a-z][a-zA-Z0-9_/.-]+\.(py|tsx|ts)`' docs/ETHICS_CHARTER.md \
                        | tr -d '`' | sort -u); do
            if [ ! -e "$path" ]; then
              echo "::error::ETHICS_CHARTER.md cites '$path', which does not exist"
              missing=1
            fi
          done
          exit $missing
