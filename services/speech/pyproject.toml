[project]
name = "samvaad-speech"
version = "0.1.0"
description = "SAMVAAD speech analysis service"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks follow different conventions (shell magics, long one-liner cells) and
# are validated by their own JSON/syntax check rather than by the source linter.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
