[project]
name = "samvaad-genai"
version = "0.1.0"
description = "SAMVAAD GenAI service - RAG, role-play, social stories and the bias-guarded rubric"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
